{% extends 'base.html' %}
{% block content %}
<h2>Admin Dashboard</h2>
<h3>Users</h3>
<table>
    <tr><th>Username</th><th>Email</th><th>Role</th></tr>
    {% for user in users %}
    <tr>
        <td>{{ user.username }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.role }}</td>
    </tr>
    {% endfor %}
</table>

<h3>Orders</h3>
<a href="{{ url_for('main.manage_orders') }}" class="btn">Manage Orders</a>
{% endblock %}
