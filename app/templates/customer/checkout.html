{% extends 'base.html' %}
{% block content %}
<h2>Checkout</h2>
<table class="checkout-table">
    <tr><th>Product</th><th>Price</th><th>Quantity</th></tr>
    {% for item in cart.values() %}
    <tr>
        <td>{{ item.name }}</td>
        <td>${{ item.price }}</td>
        <td>{{ item.quantity }}</td>
    </tr>
    {% endfor %}
</table>
<h3>Total: ${{ total_price }}</h3>
<form method="POST">
    <button type="submit" class="btn">Place Order</button>
</form>
{% endblock %}
