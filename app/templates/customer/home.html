{% extends 'base.html' %}
<head>
    <meta name="viewport" content="width=1024">
</head>
{% block content %}
<h2>Welcome to Our E-Commerce Store</h2>
<div class="products">
    {% for product in products %}
    <div class="product-card">
        {% if product.image %}
        <img src="{{ url_for('static', filename='images/' + product.image) }}" alt="Product Image">
        {% else %}
        <img src="{{ url_for('static', filename='images/default_image.jpg') }}" alt="Product Image">
        {% endif %}
        <h3>{{ product.name }}</h3>
        <p>{{ product.description }}</p>
        <p>Price: ${{ product.price }}</p>
        <a href="{{ url_for('main.add_to_cart', product_id=product.id) }}" class="btn">Add to Cart</a>
    </div>
    {% endfor %}
</div>
{% endblock %}
