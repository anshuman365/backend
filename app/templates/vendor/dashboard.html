{% extends 'base.html' %}
{% block content %}
<h2>Vendor Dashboard</h2>
<a href="{{ url_for('main.add_product') }}" class="btn">Add New Product</a>
<table>
    <tr><th>Name</th><th>Price</th><th>Stock</th><th>Actions</th></tr>
    {% for product in products %}
    <tr>
        <td>{{ product.name }}</td>
        <td>${{ product.price }}</td>
        <td>{{ product.stock }}</td>
        <td>
            <a href="{{ url_for('main.edit_product', product_id=product.id) }}" class="btn">Edit</a>
            <a href="{{ url_for('main.delete_product', product_id=product.id) }}" class="btn">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
